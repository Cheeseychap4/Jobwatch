name: jobwatch

on:
  schedule:
    # GitHub throttles scheduled workflows, so a 15-minute cron really fires
    # every 45-90 minutes. Each firing therefore stays alive and re-checks
    # every few minutes (see JOBWATCH_LOOP_SECONDS below) rather than relying
    # on the schedule for cadence.
    - cron: "*/15 * * * *"
    # Weekly heartbeat: Mondays 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Also send a test Telegram message"
        type: boolean
        default: false
      heartbeat:
        description: "Also send the Stayin alive summary"
        type: boolean
        default: false
      loop_seconds:
        description: "How long this run keeps checking, in seconds (0 = one pass)"
        type: string
        default: "2700"

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Telegram test ping
        if: ${{ inputs.test_ping }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "token length: ${#TELEGRAM_TOKEN}"
          echo "chat_id length: ${#TELEGRAM_CHAT_ID}"
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "A secret is empty - check Settings > Secrets and variables > Actions"
            exit 1
          fi
          curl -sS -w "\nHTTP %{http_code}\n" \
            "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="jobwatch test ping - if you can read this, alerts work"

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOBWATCH_HEARTBEAT: ${{ (github.event.schedule == '0 8 * * 1' || inputs.heartbeat) && '1' || '' }}
          # Keep checking for 45 minutes, every 5 minutes. With the runs
          # queueing behind each other this is close to continuous cover.
          JOBWATCH_LOOP_SECONDS: ${{ inputs.loop_seconds || '2700' }}
          JOBWATCH_INTERVAL_SECONDS: "300"
        run: python watch.py

      - name: Save state
        if: always()
        run: |
          git config user.name "jobwatch"
          git config user.email "actions@users.noreply.github.com"
          # state.json is generated, never hand-edited, so rebasing this
          # run's copy onto another run's could only ever conflict - and a
          # conflict failed the run and threw the whole pass away. Merge
          # instead, and keep trying until the push lands.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git show origin/main:state.json > theirs.json 2>/dev/null || echo '{}' > theirs.json
            python3 merge_state.py theirs.json state.json
            rm -f theirs.json
            cp state.json /tmp/state.json
            git reset --quiet --hard origin/main
            cp /tmp/state.json state.json
            git add state.json
            if git diff --staged --quiet; then
              echo "no state change"
              exit 0
            fi
            git commit -q -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push --quiet; then
              exit 0
            fi
            echo "push rejected on attempt $attempt - merging again"
            sleep $((RANDOM % 8 + 3))
          done
          echo "could not save state after 5 attempts"
          exit 1
