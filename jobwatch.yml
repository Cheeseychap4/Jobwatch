name: jobwatch

on:
  schedule:
    # Every 15 min, 06:00-21:45 UTC = 07:00-22:45 BST. Adjust for GMT in winter.
    - cron: "*/15 6-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Save state
        run: |
          git config user.name "jobwatch"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
